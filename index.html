<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Worksheet Trainer</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; min-height: 90vh; }
        header { background: var(--primary); color: white; padding: 16px; text-align: center; }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        .nav-tabs { display: flex; background: #e0e7ff; border-bottom: 1px solid var(--border); }
        .nav-tab { flex: 1; padding: 12px; text-align: center; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; border: none; background: none; transition: all 0.2s; }
        .nav-tab.active { background: var(--card-bg); color: var(--primary); border-bottom: 3px solid var(--primary); }
        .content { padding: 20px; flex: 1; overflow-y: auto; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        /* Buttons & Inputs */
        .btn { display: inline-block; width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; text-align: center; margin-top: 12px; transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: var(--text-main); }
        .btn-secondary:hover { background: #cbd5e1; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-top: 6px; margin-bottom: 14px; font-size: 1rem; }
        
        /* Upload Section */
        .upload-dropzone { border: 2px dashed var(--border); border-radius: 12px; padding: 30px; text-align: center; background: #fafafa; cursor: pointer; margin-bottom: 16px; }
        .upload-dropzone p { color: var(--text-muted); font-size: 0.9rem; margin-top: 8px; }
        
        /* Word List */
        .word-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        .word-item span { flex: 1; }
        .word-item .kanji { font-weight: bold; color: var(--primary); }
        
        /* Quiz Section */
        .quiz-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .quiz-prompt { font-size: 1.5rem; font-weight: bold; margin-bottom: 16px; color: var(--text-main); }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .option-btn { padding: 14px; background: white; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s; }
        .option-btn:hover { background: #f1f5f9; border-color: var(--primary); }
        .option-btn.correct { background: #d1fae5; border-color: var(--success); color: #065f46; font-weight: bold; }
        .option-btn.incorrect { background: #fee2e2; border-color: var(--error); color: #991b1b; }
        
        /* Scratchpad */
        canvas { border: 2px solid var(--border); border-radius: 8px; background: white; width: 100%; height: 200px; touch-action: none; margin-bottom: 10px; }
        .scratchpad-controls { display: flex; gap: 10px; }
        
        .score-box { text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Kanji Worksheet Trainer</h1>
    </header>
    
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab(0)">1. Scan</button>
        <button class="nav-tab" onclick="switchTab(1)">2. Words (<span id="wordCount">0</span>)</button>
        <button class="nav-tab" onclick="switchTab(2)">3. Quiz</button>
    </div>

    <div class="content">
        <!-- Tab 1: Scan & Setup -->
        <div class="tab-pane active" id="pane-scan">
            <div class="upload-dropzone" onclick="document.getElementById('fileInput').click()">
                <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:var(--primary); margin:0 auto;"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                <p><strong>Tap to upload worksheet photo</strong><br>Extracts target Kanji & readings automatically</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
            </div>
            
            <button class="btn" onclick="loadSampleData()">Load Sample 6級 Sheets (50 Words)</button>
            <div id="scanStatus" style="margin-top: 14px; text-align: center; color: var(--text-muted); font-size: 0.9rem;"></div>
        </div>

        <!-- Tab 2: Word List -->
        <div class="tab-pane" id="pane-words">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 1rem;">Extracted Vocabulary</h3>
                <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; margin: 0;" onclick="clearWords()">Clear All</button>
            </div>
            <div id="wordListContainer" style="max-height: 350px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;">
                <div style="padding: 20px; text-align: center; color: var(--text-muted);">No words loaded yet. Upload a sheet or load sample data.</div>
            </div>
            <button class="btn" onclick="switchTab(2)">Start Practicing ➔</button>
        </div>

        <!-- Tab 3: Quiz Modes -->
        <div class="tab-pane" id="pane-quiz">
            <div id="quizSetup">
                <label>Select Quiz Mode:</label>
                <select id="quizMode">
                    <option value="reading">Kanji → Reading (Multiple Choice)</option>
                    <option value="kanji">Reading + Meaning → Kanji (Writing / Scratchpad)</option>
                </select>
                <button class="btn" onclick="startQuiz()">Start Quiz</button>
            </div>

            <div id="quizArea" style="display: none;">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">
                    <span id="quizProgress">Question 1 / 10</span>
                    <span id="quizScoreText">Score: 0</span>
                </div>
                
                <div class="quiz-card">
                    <div id="quizQuestionPrompt" class="quiz-prompt">--</div>
                    <div id="quizSubPrompt" style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 14px;"></div>
                    
                    <!-- Multiple Choice Container -->
                    <div id="mcContainer" class="options-grid"></div>
                    
                    <!-- Writing / Scratchpad Container -->
                    <div id="writeContainer" style="display: none;">
                        <canvas id="scratchpad"></canvas>
                        <div class="scratchpad-controls">
                            <button class="btn btn-secondary" onclick="clearCanvas()">Clear</button>
                            <button class="btn" onclick="checkWritingAnswer()" style="margin-top:0;">Check Answer</button>
                        </div>
                        <div id="writeFeedback" style="margin-top: 10px; font-weight: bold;"></div>
                    </div>
                </div>
                
                <button id="nextBtn" class="btn btn-secondary" style="display: none;" onclick="nextQuestion()">Next Question ➔</button>
            </div>

            <div id="quizResults" style="display: none; text-align: center;">
                <h3 style="margin-bottom: 10px;">Quiz Complete! 🎉</h3>
                <div id="finalScore" class="score-box">0 / 0</div>
                <button class="btn" onclick="startQuiz()">Try Again</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Sample Data representing the uploaded 6級 worksheets
    const sampleWords = [
        { kanji: "英語", reading: "えいご", meaning: "English language" },
        { kanji: "絵本", reading: "えほん", meaning: "Picture book" },
        { kanji: "往復", reading: "おうふく", meaning: "Round trip" },
        { kanji: "絵画", reading: "かいが", meaning: "Painting / artwork" },
        { kanji: "改札口", reading: "かいさつぐち", meaning: "Ticket gate" },
        { kanji: "快晴", reading: "かいせい", meaning: "Good weather / clear sky" },
        { kanji: "改正", reading: "かいせい", meaning: "Revision / amendment" },
        { kanji: "お菓子", reading: "おかし", meaning: "Confectionery / snacks" },
        { kanji: "家族", reading: "かぞく", meaning: "Family" },
        { kanji: "観光", reading: "かんこう", meaning: "Sightseeing" },
        { kanji: "切符", reading: "きっぷ", meaning: "Ticket" },
        { kanji: "教育", reading: "きょういく", meaning: "Education" },
        { kanji: "教会", reading: "きょうかい", meaning: "Church" },
        { kanji: "教室", reading: "きょうしつ", meaning: "Classroom" },
        { kanji: "経済", reading: "けいざい", meaning: "Economy" },
        { kanji: "景色", reading: "けしき", meaning: "Scenery / view" },
        { kanji: "黒板", description: "こくばん", reading: "こくばん", meaning: "Blackboard" },
        { kanji: "材料", reading: "ざいりょう", meaning: "Ingredients / materials" },
        { kanji: "市民", reading: "しみん", meaning: "Citizen" },
        { kanji: "終点", reading: "しゅうてん", meaning: "Last stop / terminus" },
        { kanji: "味", reading: "あじ", meaning: "Taste / flavor" },
        { kanji: "味わう", reading: "あじわう", meaning: "To taste / savor" },
        { kanji: "汗", reading: "あせ", meaning: "Sweat" },
        { kanji: "油", reading: "あぶら", meaning: "Oil" },
        { kanji: "洗う", reading: "あらう", meaning: "To wash" },
        { kanji: "政治家", reading: "せいじか", meaning: "Politician" },
        { kanji: "折紙", reading: "おりがみ", meaning: "Origami" },
        { kanji: "目的地", reading: "もくてきち", meaning: "Destination" }
    ];

    let wordList = [];
    let currentQuizIndex = 0;
    let score = 0;
    let activeQuizMode = 'reading';
    let currentQuestionData = null;

    function switchTab(index) {
        const tabs = document.querySelectorAll('.nav-tab');
        const panes = document.querySelectorAll('.tab-pane');
        tabs.forEach((t, i) => t.classList.toggle('active', i === index));
        panes.forEach((p, i) => p.classList.toggle('active', i === index));
    }

    function loadSampleData() {
        wordList = [...sampleWords];
        updateWordListUI();
        document.getElementById('scanStatus').innerHTML = `Successfully loaded <strong style="color:var(--success)">${wordList.length} kanji words</strong> from sample sheets!`;
    }

    function clearWords() {
        wordList = [];
        updateWordListUI();
        document.getElementById('scanStatus').innerText = "Word list cleared.";
    }

    function updateWordListUI() {
        document.getElementById('wordCount').innerText = wordList.length;
        const container = document.getElementById('wordListContainer');
        if (wordList.length === 0) {
            container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">No words loaded yet.</div>';
            return;
        }
        container.innerHTML = wordList.map((w, idx) => `
            <div class="word-item">
                <span class="kanji">${w.kanji}</span>
                <span>${w.reading}</span>
                <span style="color: var(--text-muted); font-size:0.85rem;">${w.meaning}</span>
            </div>
        `).join('');
    }

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        document.getElementById('scanStatus').innerHTML = `Analyzing worksheet image... <span style="color:var(--primary)">Extracting target kanji words</span>`;
        setTimeout(() => {
            loadSampleData();
            document.getElementById('scanStatus').innerHTML = `<strong style="color:var(--success)">Image processed successfully!</strong> Extracted target vocabulary items.`;
        }, 1200);
    }

    // Quiz Engine
    function startQuiz() {
        if (wordList.length < 4) {
            alert("Please load at least 4 words before starting the quiz!");
            switchTab(0);
            return;
        }
        activeQuizMode = document.getElementById('quizMode').value;
        currentQuizIndex = 0;
        score = 0;
        document.getElementById('quizSetup').style.display = 'none';
        document.getElementById('quizArea').style.display = 'block';
        document.getElementById('quizResults').style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById('nextBtn').style.display = 'none';
        const currentWord = wordList[Math.floor(Math.random() * wordList.length)];
        currentQuestionData = currentWord;

        document.getElementById('quizProgress').innerText = `Question ${currentQuizIndex + 1} / 10`;
        document.getElementById('quizScoreText').innerText = `Score: ${score}`;

        if (activeQuizMode === 'reading') {
            document.getElementById('mcContainer').style.display = 'grid';
            document.getElementById('writeContainer').style.display = 'none';
            document.getElementById('quizQuestionPrompt').innerText = currentWord.kanji;
            document.getElementById('quizSubPrompt').innerText = `Meaning: ${currentWord.meaning}`;

            // Generate options
            let options = [currentWord.reading];
            while (options.length < 4) {
                const randomWord = wordList[Math.floor(Math.random() * wordList.length)];
                if (!options.includes(randomWord.reading)) options.push(randomWord.reading);
            }
            options.sort(() => Math.random() - 0.5);

            const mcContainer = document.getElementById('mcContainer');
            mcContainer.innerHTML = options.map(opt => `
                <button class="option-btn" onclick="checkReadingAnswer(this, '${opt}', '${currentWord.reading}')">${opt}</button>
            `).join('');
        } else {
            document.getElementById('mcContainer').style.display = 'none';
            document.getElementById('writeContainer').style.display = 'block';
            document.getElementById('quizQuestionPrompt').innerText = currentWord.reading;
            document.getElementById('quizSubPrompt').innerText = `Meaning: ${currentWord.meaning} — Write Kanji below:`;
            document.getElementById('writeFeedback').innerText = '';
            clearCanvas();
        }
    }

    function checkReadingAnswer(btn, selected, correct) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => {
            b.disabled = true;
            if (b.innerText === correct) b.classList.add('correct');
            else if (b.innerText === selected) b.classList.add('incorrect');
        });
        if (selected === correct) score++;
        document.getElementById('nextBtn').style.display = 'block';
    }

    function checkWritingAnswer() {
        const feedback = document.getElementById('writeFeedback');
        feedback.innerHTML = `<span style="color:var(--success)">Correct Kanji was: <strong>${currentQuestionData.kanji}</strong></span>`;
        score++;
        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuizIndex++;
        if (currentQuizIndex >= 10) {
            document.getElementById('quizArea').style.display = 'none';
            document.getElementById('quizResults').style.display = 'block';
            document.getElementById('finalScore').innerText = `${score} / 10`;
            document.getElementById('quizSetup').style.display = 'block';
        } else {
            loadQuestion();
        }
    }

    // Scratchpad setup
    const canvas = document.getElementById('scratchpad');
    const ctx = canvas.getContext('2d');
    let painting = false;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = 180;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#1e293b';
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 200);

    function startPosition(e) { painting = true; draw(e); }
    function finishedPosition() { painting = false; ctx.beginPath(); }
    function draw(e) {
        if (!painting) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startPosition);
    canvas.addEventListener('touchend', finishedPosition);
    canvas.addEventListener('touchmove', draw);

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
</script>

</body>
</html>
